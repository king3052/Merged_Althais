<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visit note</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:14px 18px;font:13px/1.45 Arial,Helvetica,sans-serif;color:#1d2733;background:#fff}
.banner{display:flex;flex-wrap:wrap;gap:22px;background:#eef1f4;border:1px solid #d5dce3;padding:8px 12px;margin-bottom:14px}
.banner b{font-size:14px}
h2{font-size:15px;margin:16px 0 8px;border-bottom:2px solid #5a2d82;padding-bottom:4px}
.meta{color:#5f6f7f;margin-bottom:8px}
.note{white-space:pre-wrap;border:1px solid #d5dce3;padding:12px 14px;max-width:820px;background:#fcfcfd}
</style></head>
<body>
<div class="banner" id="banner"></div>
<h2>Progress note</h2>
<div class="meta" id="meta"></div>
<div class="note" id="note" aria-label="Visit note"></div>
<script src="data.js"></script>
<script>
(function () {
  var id = new URLSearchParams(location.search).get('claimid');
  var c = MOCK_CLAIMS.filter(function (x) { return x.id === id; })[0] || MOCK_CLAIMS[0];
  var esc = function (s) { var e = document.createElement('span'); e.textContent = s == null ? '' : String(s); return e.innerHTML; };
  document.getElementById('banner').innerHTML = '<b>' + esc(c.patient) + '</b><span>DOB ' + esc(c.dob) + '</span><span>Sex ' + esc(c.sex) + '</span><span>MRN 9' + esc(c.id) + '</span>';
  document.getElementById('meta').textContent = 'Signed by ' + c.provider + ' · Visit ' + c.dos;
  document.getElementById('note').textContent = c.soap;
})();
</script>
</body></html>
