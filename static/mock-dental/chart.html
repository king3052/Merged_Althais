<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clinical note</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:14px 18px;font:13px/1.45 "Segoe UI",Tahoma,Arial,sans-serif;color:#1b2a2c;background:#fff}
.banner{display:flex;flex-wrap:wrap;gap:22px;background:#e6f1f1;border:1px solid #c9dcdc;padding:8px 12px;margin-bottom:12px}
.banner b{font-size:14px}
h2{font-size:15px;margin:14px 0 8px;border-bottom:2px solid #138086;padding-bottom:4px}
.meta{color:#5b6e70;margin-bottom:8px}
.note{white-space:pre-wrap;border:1px solid #d3dfdf;padding:12px 14px;max-width:820px;background:#fbfdfd}
</style></head>
<body>
<div class="banner" id="banner"></div>
<h2>Clinical note</h2>
<div class="meta" id="meta"></div>
<div class="note" id="note" aria-label="Clinical note"></div>
<script src="data.js"></script>
<script>
(function () {
  var id = new URLSearchParams(location.search).get('claimid');
  var c = MOCK_DENTAL.filter(function (x) { return x.id === id; })[0] || MOCK_DENTAL[0];
  var esc = function (s) { var e = document.createElement('span'); e.textContent = s == null ? '' : String(s); return e.innerHTML; };
  document.getElementById('banner').innerHTML = '<b>' + esc(c.patient) + '</b><span>DOB ' + esc(c.dob) + '</span><span>Sex ' + esc(c.sex) + '</span><span>Chart # D' + esc(c.id) + '</span>';
  document.getElementById('meta').textContent = 'Signed by ' + c.dentist + ' · Visit ' + c.dos;
  document.getElementById('note').textContent = c.soap;
})();
</script>
</body></html>
