<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | Althais</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/althais-tab-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/althais-tab-16.png" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon/althais-tab.svg" />
  <link rel="icon" type="image/png" sizes="48x48" href="/static/favicon/althais-tab-48.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/static/favicon/android-chrome-192x192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/althais-tab-180.png" />
  <link rel="icon" type="image/x-icon" href="/static/favicon/althais-tab.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Inter:wght@600&display=swap" />
  <script src="/static/js/theme.js"></script>
  <link rel="stylesheet" href="/static/althais-landing.css" />
  <link rel="stylesheet" href="/static/althais-auth.css" />
  <link rel="stylesheet" href="/static/althais-dark.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=Inter:wght@600&display=swap" />
  <link rel="stylesheet" href="/static/auth-rc.css" />
</head>
<body class="login-page rcl rcx">


<div class="lg-shell">

  <!-- the form -->
  <section class="lg-left">


    <main class="lg-main">
      <div class="lg-form">
        <div class="eyebrow" id="form-eyebrow">Welcome</div>
        <h1 class="lg-title" id="form-title">Sign in to your<br /><span class="em">Althais Workspace.</span></h1>
        <p class="lg-sub" id="form-sub">Enter your details to continue.</p>

        <div id="auth-msg" class="lg-msg" role="alert" hidden></div>

        <form id="auth-form" novalidate>
          <!-- create-account only -->
          <div id="reg-fields" hidden>
            <div class="field">
              <label for="f-org">Practice or organization</label>
              <input id="f-org" type="text" autocomplete="organization" placeholder="Mercy Cardiology" />
            </div>
          </div>

          <div class="field">
            <label for="f-email">Work email</label>
            <input id="f-email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" required placeholder="you@practice.com" />
          </div>

          <div class="field">
            <div class="field-row">
              <label for="f-password">Password</label>
              <a href="/forgot-password" id="forgot-link" class="lg-forgot">Forgot Password</a>
            </div>
            <div class="pw">
              <input id="f-password" type="password" autocomplete="current-password" required placeholder="Enter Your Password" />
              <button type="button" id="pw-toggle" class="pw-toggle" aria-label="Show password" aria-pressed="false">
                <svg class="eye-on" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 10s3-5.5 8.5-5.5S18.5 10 18.5 10 15.5 15.5 10 15.5 1.5 10 1.5 10z"/><circle cx="10" cy="10" r="2.6"/></svg>
                <svg class="eye-off" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M3 3l14 14M8.2 4.7A8.6 8.6 0 0 1 10 4.5c5.5 0 8.5 5.5 8.5 5.5a14 14 0 0 1-2.6 3.2M5.4 6.2A14 14 0 0 0 1.5 10s3 5.5 8.5 5.5c1.2 0 2.3-.3 3.3-.7"/><path d="M8.4 8.4a2.6 2.6 0 0 0 3.2 3.2"/></svg>
              </button>
            </div>
            <p id="pw-hint" class="lg-hint" hidden>Use at least 8 characters.</p>
          </div>

          <!-- two-step login: shown after a correct password when the account has it on -->
          <div id="mfa-fields" hidden>
            <div class="field">
              <label for="f-code">Code from your authenticator app</label>
              <input id="f-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="123456" style="font-family:'Geist Mono',monospace;font-size:20px;letter-spacing:.25em;text-align:center" />
            </div>
            <p class="lg-hint">Lost your phone? Enter one of your recovery codes instead, or ask your clinic's admin to reset two-step login.</p>
          </div>

          <button id="submit-btn" type="submit" class="btn btn-dark btn-lg lg-submit">
            <span id="submit-label">Sign In</span>
            <svg class="arr" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
          </button>
        </form>

        <p class="lg-switch">
          <span id="toggle-prompt">New to Althais?</span>
          <button id="toggle-mode" type="button" class="lg-link">Create An Account</button>
        </p>
      </div>
    </main>

    <footer class="lg-foot">&copy; 2026 Althais Health, Inc.</footer>
  </section>


</div>

<script src="/static/althais-login.js"></script>
</body>
</html>
