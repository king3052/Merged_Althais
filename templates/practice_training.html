<!DOCTYPE html>
<html lang="en">
<head>
  {% include "_head.html" %}
  <title>Althais — Training</title>
  <style>
    .modal-overlay { background: rgba(15,17,22,0.45); }
    .fld { width:100%; border-radius:2px; border:1px solid #e4e6eb; background:#fff; padding:7px 10px; font-size:12.5px; color:#0f1116; outline:none; }
    .fld:focus { border-color:#0d5bd7; }
    .flt { font-size:12px; border:1px solid #e4e6eb; border-radius:2px; padding:6px 8px; background:#fff; color:#2c313b; }
    .lbl { display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:#6b7280; font-weight:600; margin-bottom:5px; }
    .act { font-size:11px; font-weight:600; color:#0d5bd7; background:none; border:0; cursor:pointer; padding:0 4px; }
    .act.risk { color:#c83838; }
    .who-list { max-height:170px; overflow-y:auto; border:1px solid #e4e6eb; border-radius:2px; padding:4px 8px; }
    .who-list label { display:flex; align-items:center; gap:8px; font-size:12px; padding:4px 0; cursor:pointer; }
    html[data-theme-resolved="dark"] .fld, html[data-theme-resolved="dark"] .flt { background:#14181f; border-color:#2c313b; color:#e7eaf2; }
    html[data-theme-resolved="dark"] .who-list { border-color:#2c313b; }
    html[data-theme-resolved="dark"] .act { color:#6f9eff; }
  </style>
</head>
<body class="bg-shell">

  {% include "_nav.html" %}

  <div class="max-w-[1560px] mx-auto">
    <div class="px-6 py-5 bg-panel border-b border-line flex items-center justify-between gap-3 flex-wrap">
      <div>
        <h1 class="text-[18px] font-semibold text-ink-900">Training</h1>
        <p class="text-[12px] text-ink-500 mt-0.5">HIPAA, safety, policy, and role-specific training across the practice.</p>
      </div>
      <div class="flex items-center gap-2">
        <button id="export-btn" type="button" class="text-[12px] px-2.5 py-1.5 rounded-sm border border-line bg-white text-ink-700 hover:bg-shell font-semibold">Export CSV</button>
        <button id="assign-btn" data-admin-only type="button" class="text-[12px] px-2.5 py-1.5 rounded-sm bg-med-600 text-white hover:bg-med-700 font-semibold whitespace-nowrap">+ Assign Training</button>
      </div>
    </div>

    <div class="p-5">
      <div id="readonly-note"></div>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5" id="kpis"></div>

      <div class="flex flex-wrap items-center gap-2 mb-4">
        <select id="f-person" class="flt" aria-label="Filter by team member"></select>
        <select id="f-category" class="flt" aria-label="Filter by category"></select>
        <select id="f-status" class="flt" aria-label="Filter by status"><option value="">All Statuses</option><option>Overdue</option><option>Due Soon</option><option>Assigned</option><option>Completed</option></select>
      </div>

      <div class="bg-panel border border-line rounded-sm">
        <div class="px-4 py-2.5 border-b border-line flex items-center justify-between">
          <h3 class="text-[13px] font-semibold text-ink-900">Assigned Training</h3>
          <span id="count" class="text-[11px] text-ink-500">Loading…</span>
        </div>
        <div class="overflow-x-auto thin-scroll">
          <table class="w-full">
            <thead>
              <tr class="table-head">
                <th class="td text-left">Team Member</th>
                <th class="td text-left">Training</th>
                <th class="td text-left">Status</th>
                <th class="td text-left">Due Date</th>
                <th class="td text-left">Completed</th>
                <th class="td text-left">Certificate</th>
                <th class="td text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
          <div id="empty" class="px-4 py-10 text-center text-[12px] text-ink-500" style="display:none"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- =================== ASSIGN =================== -->
  <div id="assign-modal" class="fixed inset-0 z-40 hidden items-center justify-center modal-overlay">
    <div class="bg-white rounded-sm shadow-xl w-[480px] max-w-[92vw] max-h-[92vh] overflow-y-auto thin-scroll">
      <div class="px-4 py-3 border-b border-line flex items-center justify-between">
        <h3 class="text-[13.5px] font-semibold text-ink-900">Assign Training</h3>
        <button id="as-close" type="button" class="text-ink-400 hover:text-ink-700" aria-label="Close"><svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="p-4 space-y-3">
        <div><label class="lbl" for="as-course">Course</label><select id="as-course" class="fld"></select></div>
        <div id="as-custom-wrap" class="grid grid-cols-2 gap-3 hidden">
          <div><label class="lbl" for="as-custom">Course name</label><input id="as-custom" class="fld" /></div>
          <div><label class="lbl" for="as-category">Category</label><select id="as-category" class="fld"></select></div>
        </div>
        <div><label class="lbl" for="as-who">Assign to</label>
          <select id="as-who" class="fld"></select>
        </div>
        <div id="as-people-wrap"><div class="who-list" id="as-people"></div></div>
        <div><label class="lbl" for="as-due">Due date</label><input id="as-due" type="date" class="fld num" /></div>
        <div id="as-error" class="hidden text-[12px] text-risk-600"></div>
      </div>
      <div class="px-4 py-3 border-t border-line flex items-center justify-end gap-2">
        <button id="as-cancel" type="button" class="text-[12px] px-3 py-1.5 rounded-sm border border-line bg-white text-ink-700 hover:bg-shell">Cancel</button>
        <button id="as-save" type="button" class="text-[12px] px-3 py-1.5 rounded-sm bg-med-600 text-white hover:bg-med-700 font-semibold">Assign</button>
      </div>
    </div>
  </div>

  <!-- =================== COMPLETE =================== -->
  <div id="done-modal" class="fixed inset-0 z-40 hidden items-center justify-center modal-overlay">
    <div class="bg-white rounded-sm shadow-xl w-[380px] max-w-[92vw]">
      <div class="px-4 py-3 border-b border-line"><h3 id="dm-title" class="text-[13.5px] font-semibold text-ink-900">Mark Complete</h3></div>
      <div class="p-4 space-y-3">
        <div><label class="lbl" for="dm-date">Completed on</label><input id="dm-date" type="date" class="fld num" /></div>
        <div><label class="lbl" for="dm-cert">Certificate # (optional)</label><input id="dm-cert" class="fld mono" /></div>
      </div>
      <div class="px-4 py-3 border-t border-line flex items-center justify-end gap-2">
        <button id="dm-cancel" type="button" class="text-[12px] px-3 py-1.5 rounded-sm border border-line bg-white text-ink-700 hover:bg-shell">Cancel</button>
        <button id="dm-save" type="button" class="text-[12px] px-3 py-1.5 rounded-sm bg-ok-600 text-white hover:brightness-105 font-semibold">Mark Complete</button>
      </div>
    </div>
  </div>

  <script src="/static/js/staff-store.js"></script>
  <script>
    const S = window.StaffStore;
    const $ = (id) => document.getElementById(id);
    const esc = S.esc;
    let DOC = null, completingId = null;
    const trainable = () => DOC.people.filter(p => p.status !== 'inactive').sort((a, b) => a.name.localeCompare(b.name));

    function filtered() {
      const pid = $('f-person').value, cat = $('f-category').value, st = $('f-status').value;
      return DOC.trainings.filter(t => S.person(DOC, t.personId) && (!pid || t.personId === pid) && (!cat || t.category === cat) && (!st || S.trainingStatus(t) === st))
        .sort((a, b) => (a.completed ? 1 : 0) - (b.completed ? 1 : 0) || (a.due || '').localeCompare(b.due || ''));
    }

    function render() {
      const all = DOC.trainings.filter(t => S.person(DOC, t.personId));
      $('kpis').innerHTML = S.TRAINING_CATEGORIES.map(cat => {
        const inCat = all.filter(t => t.category === cat), done = inCat.filter(t => t.completed).length, overdue = inCat.filter(t => S.trainingStatus(t) === 'Overdue').length;
        const rate = inCat.length ? Math.round(done / inCat.length * 100) : null;
        return `<div class="bg-panel border border-line rounded-sm p-4">
          <div class="text-[10.5px] uppercase tracking-wider text-ink-500 font-semibold">${esc(cat)} Training</div>
          <div class="text-[22px] font-semibold ${rate == null ? 'text-ink-400' : (rate === 100 ? 'text-ok-600' : 'text-ink-900')} num mt-1">${rate == null ? '—' : rate + '%'}</div>
          <div class="text-[11px] ${overdue ? 'text-risk-600' : 'text-ink-400'} mt-0.5">${inCat.length ? `${done} of ${inCat.length} complete${overdue ? ` · ${overdue} overdue` : ''}` : 'nothing assigned'}</div>
        </div>`;
      }).join('');

      const rows = filtered(), edit = S.canEdit();
      $('count').textContent = rows.length === all.length ? `${all.length} assignment${all.length === 1 ? '' : 's'}` : `${rows.length} of ${all.length} assignments`;
      $('empty').style.display = rows.length ? 'none' : 'block';
      $('empty').innerHTML = all.length ? 'No training matches these filters.'
        : 'No training assigned yet. Click <span class="font-semibold text-med-600">+ Assign Training</span> to assign HIPAA, safety, policy, or role-specific courses.';
      $('rows').innerHTML = rows.map(t => {
        const p = S.person(DOC, t.personId), st = S.trainingStatus(t);
        return `
        <tr class="row-hover">
          <td class="td"><a href="/staff/team?person=${encodeURIComponent(p.id)}" class="font-semibold text-ink-900 hover:text-med-600">${esc(p.name)}</a><div class="text-[11px] text-ink-500">${esc(p.role)}</div></td>
          <td class="td text-ink-800">${esc(t.course)}<div class="text-[11px] text-ink-500">${esc(t.category)}</div></td>
          <td class="td">${S.pill(st)}</td>
          <td class="td text-[12px] ${st === 'Overdue' ? 'text-risk-600' : (st === 'Due Soon' ? 'text-warn-600' : 'text-ink-600')}">${esc(S.fmtDate(t.due))}</td>
          <td class="td text-[12px] text-ink-600">${esc(S.fmtDate(t.completed))}</td>
          <td class="td mono text-[11.5px] text-ink-600">${esc(t.certificate || '—')}</td>
          <td class="td text-right whitespace-nowrap">${edit ? `${t.completed ? `<button class="act" data-undo="${esc(t.id)}">Reopen</button>` : `<button class="act" data-complete="${esc(t.id)}">Mark Complete</button>`}<button class="act risk" data-delete="${esc(t.id)}">Delete</button>` : ''}</td>
        </tr>`;
      }).join('');
    }

    $('rows').addEventListener('click', async (e) => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.complete) {
        completingId = b.dataset.complete;
        const t = DOC.trainings.find(x => x.id === completingId);
        $('dm-title').textContent = 'Mark Complete: ' + t.course;
        $('dm-date').value = S.todayIso(); $('dm-cert').value = '';
        $('done-modal').classList.remove('hidden'); $('done-modal').classList.add('flex');
        return;
      }
      if (b.dataset.undo) DOC = await S.save(d => { const t = d.trainings.find(x => x.id === b.dataset.undo); t.completed = ''; t.certificate = ''; }, 'Reopened').catch(() => DOC);
      if (b.dataset.delete) {
        if (!confirm('Delete this training assignment?')) return;
        DOC = await S.save(d => { d.trainings = d.trainings.filter(x => x.id !== b.dataset.delete); }, 'Deleted').catch(() => DOC);
      }
      render();
    });

    function closeDone() { $('done-modal').classList.add('hidden'); $('done-modal').classList.remove('flex'); completingId = null; }
    $('dm-cancel').addEventListener('click', closeDone);
    $('dm-save').addEventListener('click', async () => {
      const id = completingId, date = $('dm-date').value || S.todayIso(), cert = $('dm-cert').value.trim();
      DOC = await S.save(d => {
        const t = d.trainings.find(x => x.id === id);
        t.completed = date; t.certificate = cert;
        const p = S.person(d, t.personId);
        if (p) {
          S.audit(p, `Completed ${t.course}`);
          // finishing HIPAA training also satisfies that onboarding requirement
          const req = t.category === 'HIPAA' && p.requirements.find(r => r.key === 'hipaa' && !r.done);
          if (req) Object.assign(req, { done: true, verifiedBy: S.currentUserName(), verifiedAt: new Date().toISOString() });
        }
      }, 'Marked complete').catch(() => DOC);
      closeDone(); render();
    });

    // ---- assign ----
    const CUSTOM = '__custom__';
    function openAssign() {
      if (!trainable().length) { S.toast('Add a team member first', 'error'); return; }
      $('as-course').innerHTML = S.TRAINING_CATALOG.map(c => `<option value="${esc(c.course)}">${esc(c.course)} (${esc(c.category)})</option>`).join('') + `<option value="${CUSTOM}">Other Course…</option>`;
      $('as-category').innerHTML = S.options(S.TRAINING_CATEGORIES, 'Role-Specific');
      $('as-who').innerHTML = S.options([{ value: 'pick', label: 'Choose People' }, { value: 'all', label: 'Everyone (Active And Onboarding)' }]
        .concat(S.ROLES_LIST.filter(r => trainable().some(p => p.role === r)).map(r => ({ value: 'role:' + r, label: 'Everyone Who Is A ' + r }))), 'pick');
      const pre = $('f-person').value;
      $('as-people').innerHTML = trainable().map(p => `<label><input type="checkbox" value="${esc(p.id)}" ${p.id === pre ? 'checked' : ''}> ${esc(p.name)} <span class="text-ink-400">${esc(p.role)}</span></label>`).join('');
      const due = new Date(); due.setDate(due.getDate() + 30);
      $('as-due').value = new Date(due.getTime() - due.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
      $('as-custom-wrap').classList.add('hidden'); $('as-people-wrap').classList.remove('hidden'); $('as-error').classList.add('hidden');
      $('assign-modal').classList.remove('hidden'); $('assign-modal').classList.add('flex');
    }
    function closeAssign() { $('assign-modal').classList.add('hidden'); $('assign-modal').classList.remove('flex'); }
    $('assign-btn').addEventListener('click', openAssign);
    $('as-close').addEventListener('click', closeAssign);
    $('as-cancel').addEventListener('click', closeAssign);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeAssign(); closeDone(); } });
    $('as-course').addEventListener('change', () => $('as-custom-wrap').classList.toggle('hidden', $('as-course').value !== CUSTOM));
    $('as-who').addEventListener('change', () => $('as-people-wrap').classList.toggle('hidden', $('as-who').value !== 'pick'));
    $('as-save').addEventListener('click', async () => {
      const err = (m) => { $('as-error').textContent = m; $('as-error').classList.remove('hidden'); };
      let course = $('as-course').value, category;
      if (course === CUSTOM) { course = $('as-custom').value.trim(); category = $('as-category').value; if (!course) return err('Name the course.'); }
      else category = S.TRAINING_CATALOG.find(c => c.course === course).category;
      const who = $('as-who').value;
      const ids = who === 'pick' ? [...$('as-people').querySelectorAll('input:checked')].map(i => i.value)
        : trainable().filter(p => who === 'all' || p.role === who.slice(5)).map(p => p.id);
      if (!ids.length) return err('Choose at least one person.');
      const due = $('as-due').value;
      if (!due) return err('Pick a due date.');
      // skip anyone who already has this course open, so assigning twice doesn't create duplicates
      const open = new Set(DOC.trainings.filter(t => t.course === course && !t.completed).map(t => t.personId));
      const fresh = ids.filter(id => !open.has(id));
      if (!fresh.length) return err('Everyone chosen already has this course assigned.');
      DOC = await S.save(d => {
        fresh.forEach(id => {
          d.trainings.push({ id: S.uid('t'), personId: id, course, category, due, completed: '', certificate: '' });
          const p = S.person(d, id); p && S.audit(p, `Assigned ${course} (due ${due})`);
        });
      }, `Assigned to ${fresh.length} ${fresh.length === 1 ? 'person' : 'people'}` + (fresh.length < ids.length ? ` (${ids.length - fresh.length} already had it)` : '')).catch(() => DOC);
      closeAssign(); render();
    });

    $('export-btn').addEventListener('click', () => {
      S.downloadCsv('training_' + S.todayIso() + '.csv', ['Team member', 'Role', 'Course', 'Category', 'Status', 'Due', 'Completed', 'Certificate'],
        filtered().map(t => { const p = S.person(DOC, t.personId); return [p.name, p.role, t.course, t.category, S.trainingStatus(t), t.due, t.completed, t.certificate]; }));
    });
    ['f-person', 'f-category', 'f-status'].forEach(id => $(id).addEventListener('input', render));

    S.load().then(d => {
      DOC = d;
      S.readOnlyBanner('readonly-note');
      const q = new URLSearchParams(location.search);
      $('f-person').innerHTML = S.options(DOC.people.slice().sort((a, b) => a.name.localeCompare(b.name)).map(p => ({ value: p.id, label: p.name })), q.get('person') || '', 'All Team Members');
      $('f-category').innerHTML = S.options(S.TRAINING_CATEGORIES, '', 'All Categories');
      render();
    }).catch(e => { $('count').textContent = e.message; });
  </script>
</body>
</html>
