<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Althais — Set new password</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      fontFamily: { sans: ['Inter', 'sans-serif'] },
      colors: {
        shell: '#f4f5f7', panel: '#ffffff', line: '#e4e6eb',
        ink: { 900: '#0f1116', 700: '#2c313b', 500: '#6b7280' },
        med: { 700: '#0a47b0', 600: '#0d5bd7', 100: '#e6efff' },
        ok: { 600: '#0c8a4f', 100: '#d8f5e3' },
        risk: { 600: '#c83838', 100: '#ffe1e1' }
      }
    } } };
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    input:focus { outline: none; border-color: #0d5bd7; box-shadow: 0 0 0 3px rgba(13,91,215,0.12); }
  </style>
</head>
<body class="bg-shell min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-[380px]">

    <div class="text-center mb-8">
      <div class="text-[13px] font-bold tracking-widest text-med-600 uppercase mb-1">ALTHAIS</div>
    </div>

    <div id="invalid" class="hidden bg-panel border border-line rounded-lg shadow-sm p-6 text-center">
      <div class="text-[32px] mb-3">🔒</div>
      <h2 class="text-[18px] font-semibold text-ink-900 mb-2">Link expired or invalid</h2>
      <p class="text-[13px] text-ink-500 mb-5">This reset link has expired or already been used. Request a new one.</p>
      <a href="/forgot-password" class="block w-full text-[13px] font-semibold bg-med-600 text-white rounded-md py-2.5 hover:bg-med-700 transition text-center">Request new link</a>
    </div>

    <div id="card" class="bg-panel border border-line rounded-lg shadow-sm p-6">
      <h2 class="text-[20px] font-semibold text-ink-900 mb-1">Set new password</h2>
      <p class="text-[13px] text-ink-500 mb-5">Choose a strong password of at least 8 characters.</p>

      <div id="msg" class="hidden mb-4 text-[12.5px] rounded-sm px-3 py-2"></div>

      <form id="form" class="space-y-4" novalidate>
        <input type="hidden" id="token" />
        <div>
          <label class="block text-[11px] font-semibold text-ink-700 mb-1.5">New password</label>
          <input id="password" type="password" autocomplete="new-password" required
            class="w-full text-[13px] border border-line rounded-md px-3 py-2 bg-white text-ink-900"
            placeholder="At least 8 characters" />
        </div>
        <div>
          <label class="block text-[11px] font-semibold text-ink-700 mb-1.5">Confirm new password</label>
          <input id="confirm" type="password" autocomplete="new-password" required
            class="w-full text-[13px] border border-line rounded-md px-3 py-2 bg-white text-ink-900"
            placeholder="Repeat password" />
        </div>
        <button id="btn" type="submit"
          class="w-full text-[13px] font-semibold bg-med-600 text-white rounded-md py-2.5 hover:bg-med-700 transition disabled:opacity-60">
          Set new password
        </button>
      </form>
    </div>

    <p class="text-center text-[12.5px] text-ink-500 mt-5">
      <a href="/login" class="text-med-600 hover:underline">← Back to sign in</a>
    </p>
  </div>

  <script>
    const $ = id => document.getElementById(id);

    // Extract token from URL
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    if (!token) {
      $('card').classList.add('hidden');
      $('invalid').classList.remove('hidden');
    } else {
      $('token').value = token;
    }

    function showMsg(text, kind) {
      const el = $('msg');
      el.textContent = text;
      el.className = 'mb-4 text-[12.5px] rounded-sm px-3 py-2 ' +
        (kind === 'ok' ? 'bg-ok-100 text-ok-600' : 'bg-risk-100 text-risk-600');
      el.classList.remove('hidden');
    }

    $('form').addEventListener('submit', async e => {
      e.preventDefault();
      const password = $('password').value;
      const confirm = $('confirm').value;
      if (password.length < 8) { showMsg('Password must be at least 8 characters.'); return; }
      if (password !== confirm) { showMsg('Passwords do not match.'); return; }
      $('btn').disabled = true; $('btn').textContent = 'Saving…';
      const body = new URLSearchParams();
      body.set('token', $('token').value);
      body.set('password', password);
      try {
        const res = await fetch('/reset-password', { method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: body.toString(), credentials: 'same-origin' });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.ok) {
          showMsg('Password updated! Redirecting to sign in…', 'ok');
          setTimeout(() => { window.location.href = data.redirect || '/login'; }, 1500);
        } else if (data.error && (data.error.includes('expired') || data.error.includes('Invalid'))) {
          $('card').classList.add('hidden');
          $('invalid').classList.remove('hidden');
        } else {
          showMsg(data.error || 'Something went wrong.');
          $('btn').disabled = false; $('btn').textContent = 'Set new password';
        }
      } catch {
        showMsg('Network error. Please try again.');
        $('btn').disabled = false; $('btn').textContent = 'Set new password';
      }
    });
  </script>
</body>
</html>
