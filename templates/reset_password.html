<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Althais</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/althais-tab-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/althais-tab-16.png" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon/althais-tab.svg" />
  <link rel="icon" type="image/png" sizes="48x48" href="/static/favicon/althais-tab-48.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/static/favicon/android-chrome-192x192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/althais-tab-180.png" />
  <link rel="icon" type="image/x-icon" href="/static/favicon/althais-tab.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Inter:wght@600&display=swap" />
  <script src="/static/js/theme.js"></script>
  <link rel="stylesheet" href="/static/althais-landing.css" />
  <link rel="stylesheet" href="/static/althais-auth.css" />
  <link rel="stylesheet" href="/static/althais-dark.css" />
</head>
<body class="login-page">

<div class="lg-shell">
  <section class="lg-left">
    <header class="lg-top">
      <a href="/" class="logo" aria-label="Althais home"><svg width="24" height="24" viewBox="0 0 80 80" fill="none" aria-hidden="true"><path d="M5,74 L40,16 L75,74" stroke="currentColor" stroke-width="8" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="25" fill="none"/><line x1="21" y1="49" x2="59" y2="49" stroke="currentColor" stroke-width="8" stroke-linecap="butt"/></svg><span>Althais</span></a>
      <a href="/" class="btn btn-ghost">
        <svg class="arr" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8H3M7 4L3 8l4 4"/></svg>
        Return To Home
      </a>
    </header>

    <main class="lg-main">
      <div class="lg-form">
        <div class="lg-head">
          <div class="eyebrow" id="form-eyebrow">New Password</div>
          <h1 class="lg-title" id="form-title">Set a new<br /><span class="em">password.</span></h1>
          <p class="lg-sub" id="form-sub">Choose a password of at least 8 characters.</p>
        </div>

        <div id="auth-msg" class="lg-msg" role="alert" hidden></div>

        <form id="auth-form" novalidate>
          <div class="field">
            <label for="f-password">New password</label>
            <div class="pw">
              <input id="f-password" type="password" autocomplete="new-password" required placeholder="Choose A New Password" />
              <button type="button" class="pw-toggle" data-for="f-password" aria-label="Show password" aria-pressed="false">
                <svg class="eye-on" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 10s3-5.5 8.5-5.5S18.5 10 18.5 10 15.5 15.5 10 15.5 1.5 10 1.5 10z"/><circle cx="10" cy="10" r="2.6"/></svg>
                <svg class="eye-off" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M3 3l14 14M8.2 4.7A8.6 8.6 0 0 1 10 4.5c5.5 0 8.5 5.5 8.5 5.5a14 14 0 0 1-2.6 3.2M5.4 6.2A14 14 0 0 0 1.5 10s3 5.5 8.5 5.5c1.2 0 2.3-.3 3.3-.7"/><path d="M8.4 8.4a2.6 2.6 0 0 0 3.2 3.2"/></svg>
              </button>
            </div>
          </div>
          <div class="field">
            <label for="f-confirm">Confirm new password</label>
            <div class="pw">
              <input id="f-confirm" type="password" autocomplete="new-password" required placeholder="Repeat Your Password" />
              <button type="button" class="pw-toggle" data-for="f-confirm" aria-label="Show password" aria-pressed="false">
                <svg class="eye-on" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 10s3-5.5 8.5-5.5S18.5 10 18.5 10 15.5 15.5 10 15.5 1.5 10 1.5 10z"/><circle cx="10" cy="10" r="2.6"/></svg>
                <svg class="eye-off" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M3 3l14 14M8.2 4.7A8.6 8.6 0 0 1 10 4.5c5.5 0 8.5 5.5 8.5 5.5a14 14 0 0 1-2.6 3.2M5.4 6.2A14 14 0 0 0 1.5 10s3 5.5 8.5 5.5c1.2 0 2.3-.3 3.3-.7"/><path d="M8.4 8.4a2.6 2.6 0 0 0 3.2 3.2"/></svg>
              </button>
            </div>
          </div>
          <button id="submit-btn" type="submit" class="btn btn-dark btn-lg lg-submit">
            <span id="submit-label">Set New Password</span>
            <svg class="arr" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
          </button>
        </form>

        <div id="invalid" hidden>
          <div class="lg-actions">
            <a href="/forgot-password" class="btn btn-dark btn-lg lg-submit">Request New Link <svg class="arr" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></a>
          </div>
        </div>

        <p class="lg-switch" id="back-line">Remembered it? <a href="/login" class="lg-link">Sign In</a></p>
      </div>
    </main>

    <footer class="lg-foot">&copy; 2026 Althais Health, Inc.</footer>
  </section>
</div>

<script>
(function () {
  "use strict";
  function $(id) { return document.getElementById(id); }
  var msg = $("auth-msg"), btn = $("submit-btn"), label = $("submit-label");
  var pw = $("f-password"), confirmInput = $("f-confirm");
  var token = new URLSearchParams(window.location.search).get("token") || "";

  function showMsg(text, kind, bad) {
    msg.textContent = text; msg.classList.toggle("ok", kind === "ok"); msg.hidden = false;
    [pw, confirmInput].forEach(function (i) { i.classList.toggle("bad", (bad || []).indexOf(i) !== -1); });
  }
  function clearMsg() { msg.hidden = true; pw.classList.remove("bad"); confirmInput.classList.remove("bad"); }
  [pw, confirmInput].forEach(function (i) { i.addEventListener("input", function () { i.classList.remove("bad"); }); });

  function showInvalid() {
    $("form-eyebrow").textContent = "Link Expired";
    $("form-title").innerHTML = 'This link has<br /><span class="em">expired.</span>';
    $("form-sub").textContent = "This reset link has expired or already been used. Request a new one.";
    $("auth-form").hidden = true; $("back-line").hidden = true; $("invalid").hidden = false; clearMsg();
  }
  if (!token) showInvalid();

  /* show / hide password, one toggle per field */
  Array.prototype.forEach.call(document.querySelectorAll(".pw-toggle"), function (t) {
    t.addEventListener("click", function () {
      var input = $(t.getAttribute("data-for")), show = input.type === "password";
      input.type = show ? "text" : "password";
      t.setAttribute("aria-pressed", String(show)); t.setAttribute("aria-label", show ? "Hide password" : "Show password");
      t.querySelector(".eye-on").hidden = show; t.querySelector(".eye-off").hidden = !show; input.focus();
    });
  });

  $("auth-form").addEventListener("submit", function (e) {
    e.preventDefault(); clearMsg();
    var password = pw.value, confirm = confirmInput.value;
    if (password.length < 8) { showMsg("Password must be at least 8 characters.", "err", [pw]); pw.focus(); return; }
    if (password !== confirm) { showMsg("Passwords do not match.", "err", [confirmInput]); confirmInput.focus(); return; }

    btn.disabled = true; btn.classList.add("is-busy");
    var original = label.textContent; label.textContent = "Saving…";
    var body = new URLSearchParams(); body.set("token", token); body.set("password", password);
    fetch("/reset-password", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: body.toString(), credentials: "same-origin" })
      .then(function (res) { return res.json().catch(function () { return {}; }).then(function (d) { return { ok: res.ok, d: d }; }); })
      .then(function (r) {
        if (r.ok && r.d && r.d.ok) {
          showMsg("Password updated. Taking you to sign in…", "ok");
          label.textContent = "Redirecting…";
          setTimeout(function () { window.location.href = r.d.redirect || "/login"; }, 1500);
          return;
        }
        var err = r.d && typeof r.d.error === "string" ? r.d.error : "";
        if (/expired|invalid/i.test(err)) { showInvalid(); }
        else { showMsg(err || "Something went wrong. Please try again.", "err"); }
        btn.disabled = false; btn.classList.remove("is-busy"); label.textContent = original;
      })
      .catch(function () {
        showMsg("We could not reach the server. Check your connection and try again.", "err");
        btn.disabled = false; btn.classList.remove("is-busy"); label.textContent = original;
      });
  });
})();
</script>
</body>
</html>
