{% include "_primary_nav.html" %}

<!-- =================== SECONDARY NAVIGATION =================== -->
<nav class="bg-panel border-b border-line sticky top-12 z-20">
  <div class="max-w-[1560px] mx-auto flex items-center px-4 h-[38px] overflow-x-auto thin-scroll" id="secondary-nav"></div>
</nav>

<script>
  (function () {
    const NAVIGATION = {
      overview: { href: '/overview', items: [
        { label: 'Dashboard', href: '/overview' },
        { label: 'Tasks', href: '/overview/tasks' },
        { label: 'AI Inbox', href: '/overview/inbox' },
        { label: 'Analytics', href: '/overview/analytics' },
        { label: 'Recent Activity', href: '/overview/activity' },
      ]},
      emr: { href: '/emr', items: [
        { label: 'Patients', href: '/emr/patients' },
        { label: 'Schedule', href: '/emr/schedule' },
        { label: 'Encounters', href: '/emr/encounters' },
        { label: 'Charting', href: '/emr/charting' },
        { label: 'AI Second Brain', href: '/emr/second-brain' },
        { label: 'Documents', href: '/emr/documents' },
      ]},
      revenue: { href: '/revenue/claims', items: [
        { label: 'Claims', href: '/revenue/claims' },
        { label: 'Coding', href: '/revenue/coding' },
        { label: 'Denials', href: '/revenue/denials' },
        { label: 'Appeals', href: '/revenue/appeals' },
        { label: 'Payments', href: '/revenue/payments' },
        { label: 'Payer Intelligence', href: '/revenue/payer-intelligence' },
      ]},
      staff: { href: '/staff/team', items: [
        { label: 'Team', href: '/staff/team' },
        { label: 'Onboarding', href: '/staff/onboarding' },
        { label: 'Clinic Onboarding', href: '/staff/clinic-onboarding' },
        { label: 'Credentials', href: '/staff/credentials' },
        { label: 'Compliance', href: '/staff/compliance' },
        { label: 'Training', href: '/staff/training' },
        { label: 'Roles', href: '/staff/roles' },
      ]},
    };

    const path = window.location.pathname.replace(/\/+$/, '') || '/';
    let activeWorkspace = null;
    for (const key of Object.keys(NAVIGATION)) {
      if (path === '/' + key || path.startsWith('/' + key + '/')) { activeWorkspace = key; break; }
    }

    const secondaryNav = document.getElementById('secondary-nav');
    if (activeWorkspace) {
      const items = NAVIGATION[activeWorkspace].items;
      secondaryNav.innerHTML = items.map(item => {
        const itemPath = item.href.replace(/\/+$/, '') || '/';
        const isActive = path === itemPath;
        return `<a class="nav-tab${isActive ? ' active' : ''}" href="${item.href}">${item.label}</a>`;
      }).join('');
    }
  })();
</script>
