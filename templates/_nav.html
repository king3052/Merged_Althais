{% set imp = impersonation_info(request) %}
{% if imp %}
<div id="impersonation-banner" style="background:#f59e0b;color:#1a1200;padding:8px 16px;text-align:center;font-size:13px;font-weight:600;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;">
  <span>⚠️ Viewing as this account via Althais Admin — for support only. Ends automatically in a few minutes.</span>
  <form action="/admin/end-impersonation" method="post" style="display:inline;margin:0;">
    <button type="submit" style="background:#1a1200;color:#f59e0b;border:none;border-radius:4px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;">End &amp; Return To Admin</button>
  </form>
</div>
{% endif %}
{% include "_primary_nav.html" %}

<!-- =================== SECONDARY NAVIGATION =================== -->
<nav class="bg-panel border-b border-line sticky top-12 z-20">
  <div class="max-w-[1560px] mx-auto flex items-center px-4 h-[38px] overflow-x-auto thin-scroll" id="secondary-nav"></div>
</nav>

<script>
  (function () {
    const NAVIGATION = {
      overview: { href: '/overview', items: [
        { label: 'Dashboard', href: '/overview' },
        { label: 'Tasks', href: '/overview/tasks' },
        { label: 'AI Inbox', href: '/overview/inbox' },
        { label: 'Analytics', href: '/overview/analytics' },
        { label: 'Recent Activity', href: '/overview/activity' },
      ]},
      emr: { href: '/emr', items: [
        { label: 'Patients', href: '/emr/patients' },
        { label: 'Schedule', href: '/emr/schedule' },
        { label: 'Encounters', href: '/emr/encounters' },
        { label: 'Charting', href: '/emr/charting' },
        { label: 'AI Second Brain', href: '/emr/second-brain' },
        { label: 'Documents', href: '/emr/documents' },
        { label: 'Scribe', href: '/scribe' },
      ]},
      revenue: { href: '/revenue/claims', items: [
        { label: 'Claims', href: '/revenue/claims' },
        { label: 'Coding', href: '/revenue/coding' },
        { label: 'Denials', href: '/revenue/denials' },
        { label: 'Appeals', href: '/revenue/appeals' },
        { label: 'Payments', href: '/revenue/payments' },
        { label: 'Payer Intelligence', href: '/revenue/payer-intelligence' },
        { label: 'Code A Note', href: '/coding' },
      ]},
      staff: { href: '/staff/team', items: [
        { label: 'Team', href: '/staff/team' },
        { label: 'Onboarding', href: '/staff/onboarding' },
        { label: 'Clinic Onboarding', href: '/staff/clinic-onboarding' },
        { label: 'Credentials', href: '/staff/credentials' },
        { label: 'Compliance', href: '/staff/compliance' },
        { label: 'Training', href: '/staff/training' },
        { label: 'Roles', href: '/staff/roles' },
      ]},
    };

    // Single-tool plans get their own sub-menus (see _primary_nav.html for which plan is which)
    const TOOL_NAVIGATION = {
      scribe: { items: [{ label: 'Write A Note', href: '/scribe' }] },
      coding: { items: [{ label: 'Code A Note', href: '/coding' }] },
      insurance: { items: NAVIGATION.revenue.items.filter(i => !['/revenue/coding', '/coding'].includes(i.href)) },
      staff: NAVIGATION.staff,
    };
    const path = window.location.pathname.replace(/\/+$/, '') || '/';
    const activeWorkspace = window.__ALTHAIS_WORKSPACE__ || null;
    const menus = window.__ALTHAIS_SUITE__ === false ? TOOL_NAVIGATION : NAVIGATION;

    const secondaryNav = document.getElementById('secondary-nav');
    if (path === '/manager') {
      // Manager's own sections (the page switches between them by #hash)
      secondaryNav.innerHTML = [['employees', 'Employees'], ['access', 'Roles & Access']]
        .map(([k, l]) => `<a class="nav-tab" data-ca-tab="${k}" href="#${k}">${l}</a>`).join('');
    } else if (activeWorkspace) {
      const isBlocked = window.__ALTHAIS_IS_BLOCKED__ || (() => false);
      const items = (menus[activeWorkspace] || { items: [] }).items.filter(item => !isBlocked(item.href));   // switched off by their manager
      secondaryNav.innerHTML = items.map(item => {
        const itemPath = item.href.replace(/\/+$/, '') || '/';
        const isActive = path === itemPath;
        return `<a class="nav-tab${isActive ? ' active' : ''}" href="${item.href}">${item.label}</a>`;
      }).join('');
    }
  })();
</script>

<!-- Althea, the assistant, on every section (the EMR page has its own copy) -->
<script src="/static/js/althea-ui.js"></script>
<script src="/static/js/althea-revenue.js"></script>
<script src="/static/js/althea.js"></script>
