<script>window.__ALTHAIS_USER__ = {{ user_json | safe }};</script>

<!-- =================== PRIMARY NAVIGATION =================== -->
<header class="bg-med-600 text-white sticky top-0 z-30">
  <div class="max-w-[1560px] mx-auto flex h-12 items-center px-4">
    <a href="/overview" class="flex items-center pr-4 border-r border-white/15 mr-4 h-full select-none flex-shrink-0" aria-label="Althais">
      <span class="text-[15px] font-semibold tracking-[0.18em] leading-none">ALTHAIS</span>
    </a>
    <span id="nav-org-name" class="text-[12px] text-white/55 mr-6 hidden md:block truncate max-w-[180px]">—</span>

    <nav class="flex items-center h-full overflow-x-auto thin-scroll">
      <a class="primary-tab" data-workspace="overview" href="/overview">Overview</a>
      <a class="primary-tab" data-workspace="emr" href="/emr/patients">EMR</a>
      <a class="primary-tab" data-workspace="revenue" href="/revenue/claims">Revenue</a>
      <a class="primary-tab" data-workspace="staff" href="/staff/team">Staff</a>
    </nav>

    <div class="ml-auto flex items-center gap-3 pl-3 flex-shrink-0">
      <a href="/emr#settings" title="Settings" class="flex items-center gap-1.5 text-white/70 hover:text-white text-[12.5px]">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.9 2.9l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V19.6a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.9-2.9l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H2.4a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4 8.6a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.9-2.9l.06.06A1.7 1.7 0 0 0 8.4 4.17H8.5a1.7 1.7 0 0 0 1-1.55V2.5a2 2 0 1 1 4 0v.09c0 .69.4 1.3 1 1.55h.1a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.9 2.9l-.06.06a1.7 1.7 0 0 0-.34 1.87v.1c.25.6.86 1 1.55 1h.19a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1Z"/></svg>
        <span class="hidden lg:inline">Settings</span>
      </a>
      <div class="h-5 w-px bg-white/25"></div>
      <div class="flex items-center gap-2">
        <div id="nav-avatar" class="w-7 h-7 rounded-sm bg-white/15 text-white text-[11px] font-semibold flex items-center justify-center flex-shrink-0">--</div>
        <span id="nav-user-name" class="text-[12.5px] text-white/85 hidden sm:block whitespace-nowrap">—</span>
        <form method="POST" action="/logout" style="margin:0">
          <button type="submit" title="Sign out" class="flex items-center justify-center w-7 h-7 rounded-sm hover:bg-white/10 text-white/70 hover:text-white">
            <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </form>
      </div>
    </div>
  </div>
</header>

<!-- =================== SECONDARY NAVIGATION =================== -->
<nav class="bg-panel border-b border-line sticky top-12 z-20">
  <div class="max-w-[1560px] mx-auto flex items-center px-4 h-[38px] overflow-x-auto thin-scroll" id="secondary-nav"></div>
</nav>

<script>
  (function () {
    const NAVIGATION = {
      overview: { href: '/overview', items: [
        { label: 'Dashboard', href: '/overview' },
        { label: 'Tasks', href: '/overview/tasks' },
        { label: 'AI Inbox', href: '/overview/inbox' },
        { label: 'Analytics', href: '/overview/analytics' },
        { label: 'Recent Activity', href: '/overview/activity' },
      ]},
      emr: { href: '/emr/patients', items: [
        { label: 'Patients', href: '/emr/patients' },
        { label: 'Schedule', href: '/emr/schedule' },
        { label: 'Encounters', href: '/emr/encounters' },
        { label: 'Charting', href: '/emr/charting' },
        { label: 'AI Second Brain', href: '/emr/second-brain' },
        { label: 'Documents', href: '/emr/documents' },
      ]},
      revenue: { href: '/revenue/claims', items: [
        { label: 'Claims', href: '/revenue/claims' },
        { label: 'Coding', href: '/revenue/coding' },
        { label: 'Denials', href: '/revenue/denials' },
        { label: 'Appeals', href: '/revenue/appeals' },
        { label: 'Payments', href: '/revenue/payments' },
        { label: 'Payer Intelligence', href: '/revenue/payer-intelligence' },
      ]},
      staff: { href: '/staff/team', items: [
        { label: 'Team', href: '/staff/team' },
        { label: 'Onboarding', href: '/staff/onboarding' },
        { label: 'Credentials', href: '/staff/credentials' },
        { label: 'Compliance', href: '/staff/compliance' },
        { label: 'Training', href: '/staff/training' },
      ]},
    };

    const path = window.location.pathname.replace(/\/+$/, '') || '/';
    let activeWorkspace = null;
    for (const key of Object.keys(NAVIGATION)) {
      if (path === '/' + key || path.startsWith('/' + key + '/')) { activeWorkspace = key; break; }
    }

    document.querySelectorAll('.primary-tab').forEach(tab => {
      if (tab.dataset.workspace === activeWorkspace) tab.classList.add('active');
    });

    const secondaryNav = document.getElementById('secondary-nav');
    if (activeWorkspace) {
      const items = NAVIGATION[activeWorkspace].items;
      secondaryNav.innerHTML = items.map(item => {
        const itemPath = item.href.replace(/\/+$/, '') || '/';
        const isActive = path === itemPath;
        return `<a class="nav-tab${isActive ? ' active' : ''}" href="${item.href}">${item.label}</a>`;
      }).join('');
    }

    const u = window.__ALTHAIS_USER__ || {};
    const displayName = u.provider_name || u.full_name || (u.email ? u.email.split('@')[0] : 'there');
    const initialsSrc = u.provider_name || u.full_name || u.email || 'A';
    const initials = initialsSrc.replace(/^Dr\.?\s*/i, '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || 'A';
    document.getElementById('nav-avatar').textContent = initials;
    document.getElementById('nav-user-name').textContent = displayName;
    document.getElementById('nav-org-name').textContent = u.organization || 'Althais';
  })();
</script>
