<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Sign In | Althais</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/althais-tab-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/althais-tab-16.png" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon/althais-tab.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/althais-tab-180.png" />
  <link rel="icon" type="image/x-icon" href="/static/favicon/althais-tab.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Inter:wght@600&display=swap" />
  <script src="/static/js/theme.js"></script>
  <link rel="stylesheet" href="/static/althais-landing.css" />
  <link rel="stylesheet" href="/static/althais-auth.css" />
  <link rel="stylesheet" href="/static/althais-dark.css" />
</head>
<body class="login-page">

<div class="lg-shell">
  <!-- Same sign-in page as the app, for the Althais team -->
  <section class="lg-left">
    <header class="lg-top">
      <a href="/" class="logo" aria-label="Althais home"><svg width="24" height="24" viewBox="0 0 80 80" fill="none" aria-hidden="true"><path d="M5,74 L40,16 L75,74" stroke="currentColor" stroke-width="8" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="25" fill="none"/><line x1="21" y1="49" x2="59" y2="49" stroke="currentColor" stroke-width="8" stroke-linecap="butt"/></svg><span>Althais</span></a>
      <a href="/login" class="btn btn-ghost">
        <svg class="arr" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8H3M7 4L3 8l4 4"/></svg>
        Back To App Sign In
      </a>
    </header>

    <main class="lg-main">
      <div class="lg-form">
        <div class="eyebrow">Althais Team</div>
        <h1 class="lg-title">Sign in to the<br /><span class="em">Admin Console.</span></h1>
        <p class="lg-sub" style="margin-bottom:22px">Clinics, plans and accounts across Althais.</p>

        <div id="msg" class="lg-msg" role="alert" hidden></div>

        <form id="form" novalidate>
          <div class="field">
            <label for="username">Username</label>
            <input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required placeholder="admin" autofocus />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="pw">
              <input id="password" type="password" autocomplete="current-password" required placeholder="Enter Your Password" />
              <button type="button" id="pw-toggle" class="pw-toggle" aria-label="Show password" aria-pressed="false">
                <svg class="eye-on" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 10s3-5.5 8.5-5.5S18.5 10 18.5 10 15.5 15.5 10 15.5 1.5 10 1.5 10z"/><circle cx="10" cy="10" r="2.6"/></svg>
                <svg class="eye-off" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M3 3l14 14M8.2 4.7A8.6 8.6 0 0 1 10 4.5c5.5 0 8.5 5.5 8.5 5.5a14 14 0 0 1-2.6 3.2M5.4 6.2A14 14 0 0 0 1.5 10s3 5.5 8.5 5.5c1.2 0 2.3-.3 3.3-.7"/><path d="M8.4 8.4a2.6 2.6 0 0 0 3.2 3.2"/></svg>
              </button>
            </div>
          </div>
          <button id="btn" type="submit" class="btn btn-dark btn-lg lg-submit">
            <span id="btn-label">Sign In</span>
            <svg class="arr" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
          </button>
        </form>
      </div>
    </main>

    <footer class="lg-foot">&copy; 2026 Althais Health, Inc.</footer>
  </section>
</div>

<script>
  const $ = id => document.getElementById(id);
  function showMsg(text) { $('msg').textContent = text; $('msg').hidden = false; }
  $('pw-toggle').addEventListener('click', () => {
    const show = $('password').type === 'password';
    $('password').type = show ? 'text' : 'password';
    $('pw-toggle').setAttribute('aria-pressed', String(show));
    $('pw-toggle').setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    $('pw-toggle').querySelector('.eye-on').hidden = show;
    $('pw-toggle').querySelector('.eye-off').hidden = !show;
  });
  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    $('msg').hidden = true;
    if (!$('username').value.trim() || !$('password').value) { showMsg('Enter your username and password.'); return; }
    $('btn').disabled = true; $('btn-label').textContent = 'Signing In…';
    const body = new URLSearchParams();
    body.set('username', $('username').value.trim());
    body.set('password', $('password').value);
    try {
      const res = await fetch('/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body.toString(), credentials: 'same-origin' });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.ok) { location.href = data.redirect || '/admin'; return; }
      showMsg(data.error || 'Invalid credentials.');
    } catch { showMsg('Network error. Try again.'); }
    finally { $('btn').disabled = false; $('btn-label').textContent = 'Sign In'; }
  });
</script>
</body>
</html>
