<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Althais</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet" />
</head>
<body style="margin:0; min-height:100vh; background:
  radial-gradient(1300px 950px at 5% 105%, rgba(53,102,205,0.6), transparent 62%),
  radial-gradient(1000px 1400px at 100% 50%, rgba(110,155,230,0.4), transparent 58%),
  radial-gradient(700px 500px at 100% 100%, rgba(90,140,220,0.35), transparent 55%),
  #ffffff;
">
  <header style="height:76px; border-bottom:1px solid #d9d9d9; display:flex; align-items:center; justify-content:space-between; padding:0 40px; font-family:'Inter',Arial,sans-serif;">
    <a href="/" style="display:flex; align-items:center; gap:12px; text-decoration:none;">
      <svg width="24" height="24" viewBox="0 0 80 80" fill="none" aria-hidden="true">
        <path d="M5,74 L40,16 L75,74" stroke="#14151a" stroke-width="8" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="25" fill="none"/>
        <line x1="21" y1="49" x2="59" y2="49" stroke="#14151a" stroke-width="8" stroke-linecap="butt"/>
      </svg>
      <span style="font-size:15px; font-weight:600; letter-spacing:0.35em; color:#14151a; text-transform:uppercase; padding-left:0.35em;">Althais</span>
    </a>
    <a href="/login" style="font-size:12px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:#14151a; text-decoration:none;">Log in</a>
  </header>

  <section style="padding:140px 24px 0; text-align:center;">
    <h1 style="margin:0; font-family:'Inter',Arial,sans-serif; font-weight:500; color:#1a1a1a; letter-spacing:-0.01em; line-height:1.2; font-size:clamp(2.2rem, 5.5vw, 3.6rem);">
      Medical Intelligence<br />for the AI Era
    </h1>
    <p style="margin:22px auto 0; max-width:640px; font-family:'Inter',Arial,sans-serif; font-weight:400; font-size:16px; line-height:1.6; color:#4a4a4a;">
      Althais is the intelligence layer for modern healthcare teams — connecting documentation, coding, and claims so providers get paid faster.
    </p>
    <a href="/demo" style="display:inline-block; margin-top:32px; background:#14151a; color:#fff; font-family:'Inter',Arial,sans-serif; font-weight:600; font-size:15px; padding:14px 30px; border-radius:999px; text-decoration:none;">Book A Demo</a>
  </section>
</body>
</html>
