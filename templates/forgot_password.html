<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Althais — Reset password</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      fontFamily: { sans: ['Inter', 'sans-serif'] },
      colors: {
        shell: '#f4f5f7', panel: '#ffffff', line: '#e4e6eb',
        ink: { 900: '#0f1116', 700: '#2c313b', 500: '#6b7280' },
        med: { 700: '#0a47b0', 600: '#0d5bd7', 100: '#e6efff' },
        ok: { 600: '#0c8a4f', 100: '#d8f5e3' },
        risk: { 600: '#c83838', 100: '#ffe1e1' }
      }
    } } };
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    input:focus { outline: none; border-color: #0d5bd7; box-shadow: 0 0 0 3px rgba(13,91,215,0.12); }
  </style>
</head>
<body class="bg-shell min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-[380px]">

    <div class="text-center mb-8">
      <div class="text-[13px] font-bold tracking-widest text-med-600 uppercase mb-1">ALTHAIS</div>
    </div>

    <div class="bg-panel border border-line rounded-lg shadow-sm p-6">
      <h2 id="title" class="text-[20px] font-semibold text-ink-900 mb-1">Forgot password?</h2>
      <p id="sub" class="text-[13px] text-ink-500 mb-5">Enter your email and we'll send you a reset link.</p>

      <div id="msg" class="hidden mb-4 text-[12.5px] rounded-sm px-3 py-2"></div>

      <form id="form" class="space-y-4" novalidate>
        <div>
          <label class="block text-[11px] font-semibold text-ink-700 mb-1.5">Work email</label>
          <input id="email" type="email" autocomplete="email" required
            class="w-full text-[13px] border border-line rounded-md px-3 py-2 bg-white text-ink-900"
            placeholder="you@practice.com" />
        </div>
        <button id="btn" type="submit"
          class="w-full text-[13px] font-semibold bg-med-600 text-white rounded-md py-2.5 hover:bg-med-700 transition disabled:opacity-60">
          Send reset link
        </button>
      </form>
    </div>

    <p class="text-center text-[12.5px] text-ink-500 mt-5">
      <a href="/login" class="text-med-600 hover:underline">← Back to sign in</a>
    </p>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    function showMsg(text, kind) {
      const el = $('msg');
      el.textContent = text;
      el.className = 'mb-4 text-[12.5px] rounded-sm px-3 py-2 ' +
        (kind === 'ok' ? 'bg-ok-100 text-ok-600' : 'bg-risk-100 text-risk-600');
      el.classList.remove('hidden');
    }
    $('form').addEventListener('submit', async e => {
      e.preventDefault();
      const email = $('email').value.trim();
      if (!email) { showMsg('Enter your email address.'); return; }
      $('btn').disabled = true; $('btn').textContent = 'Sending…';
      const body = new URLSearchParams(); body.set('email', email);
      try {
        const res = await fetch('/forgot-password', { method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: body.toString(), credentials: 'same-origin' });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.ok) {
          $('title').textContent = 'Check your email';
          $('sub').textContent = 'If an account exists for ' + email + ', you\'ll receive a reset link shortly.';
          $('form').classList.add('hidden');
        } else {
          showMsg(data.error || 'Something went wrong.');
        }
      } catch { showMsg('Network error. Please try again.'); }
      finally { $('btn').disabled = false; $('btn').textContent = 'Send reset link'; }
    });
  </script>
</body>
</html>
