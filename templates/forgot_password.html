<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | Althais</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/althais-tab-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/althais-tab-16.png" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon/althais-tab.svg" />
  <link rel="icon" type="image/png" sizes="48x48" href="/static/favicon/althais-tab-48.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/static/favicon/android-chrome-192x192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/althais-tab-180.png" />
  <link rel="icon" type="image/x-icon" href="/static/favicon/althais-tab.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Inter:wght@600&display=swap" />
  <link rel="stylesheet" href="/static/althais-landing.css" />
  <link rel="stylesheet" href="/static/althais-auth.css" />
</head>
<body class="login-page">

<div class="lg-shell">
  <section class="lg-left">
    <header class="lg-top">
      <a href="/" class="logo" aria-label="Althais home"><svg width="24" height="24" viewBox="0 0 80 80" fill="none" aria-hidden="true"><path d="M5,74 L40,16 L75,74" stroke="currentColor" stroke-width="8" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="25" fill="none"/><line x1="21" y1="49" x2="59" y2="49" stroke="currentColor" stroke-width="8" stroke-linecap="butt"/></svg><span>Althais</span></a>
      <a href="/" class="btn btn-ghost">
        <svg class="arr" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8H3M7 4L3 8l4 4"/></svg>
        Return To Home
      </a>
    </header>

    <main class="lg-main">
      <div class="lg-form">
        <div class="lg-head">
          <div class="eyebrow" id="form-eyebrow">Reset Password</div>
          <h1 class="lg-title" id="form-title">Forgot your<br /><span class="em">password?</span></h1>
          <p class="lg-sub" id="form-sub">Enter your email to get a reset link.</p>
        </div>

        <div id="auth-msg" class="lg-msg" role="alert" hidden></div>

        <form id="auth-form" novalidate>
          <div class="field">
            <label for="f-email">Work email</label>
            <input id="f-email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" required placeholder="you@practice.com" />
          </div>
          <button id="submit-btn" type="submit" class="btn btn-dark btn-lg lg-submit">
            <span id="submit-label">Send Reset Link</span>
            <svg class="arr" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
          </button>
        </form>

        <div id="sent" hidden>
          <div class="lg-actions">
            <a href="/login" class="btn btn-dark btn-lg lg-submit">Back To Sign In <svg class="arr" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></a>
          </div>
          <p class="lg-switch">Wrong email? <button id="try-again" type="button" class="lg-link">Try Again</button></p>
        </div>

        <p class="lg-switch" id="back-line">Remembered it? <a href="/login" class="lg-link">Sign In</a></p>
      </div>
    </main>

    <footer class="lg-foot">&copy; 2026 Althais Health, Inc.</footer>
  </section>
</div>

<script>
(function () {
  "use strict";
  function $(id) { return document.getElementById(id); }
  var msg = $("auth-msg"), btn = $("submit-btn"), label = $("submit-label"), input = $("f-email");
  var IDLE = { eyebrow: "Reset Password", title: 'Forgot your<br /><span class="em">password?</span>', sub: "Enter your email to get a reset link." };

  function showMsg(text) { msg.textContent = text; msg.classList.remove("ok"); msg.hidden = false; }
  function clearMsg() { msg.hidden = true; input.classList.remove("bad"); }
  input.addEventListener("input", function () { input.classList.remove("bad"); });

  function showSent(email) {
    $("form-eyebrow").textContent = "Check Your Email";
    $("form-title").innerHTML = 'Check your<br /><span class="em">email.</span>';
    var sub = $("form-sub");
    sub.textContent = "If an account exists for ";
    var span = document.createElement("span"); span.className = "lg-email"; span.textContent = email;   /* textContent: never HTML */
    sub.appendChild(span); sub.appendChild(document.createTextNode(", a reset link is on its way."));
    $("auth-form").hidden = true; $("back-line").hidden = true; $("sent").hidden = false; clearMsg();
  }
  function showIdle() {
    $("form-eyebrow").textContent = IDLE.eyebrow; $("form-title").innerHTML = IDLE.title; $("form-sub").textContent = IDLE.sub;
    $("sent").hidden = true; $("auth-form").hidden = false; $("back-line").hidden = false; input.value = ""; input.focus();
  }
  $("try-again").addEventListener("click", showIdle);

  $("auth-form").addEventListener("submit", function (e) {
    e.preventDefault(); clearMsg();
    var email = input.value.trim();
    if (!email || email.indexOf("@") === -1) {
      showMsg("Enter a valid email address."); input.classList.add("bad"); input.focus(); return;
    }
    btn.disabled = true; btn.classList.add("is-busy");
    var original = label.textContent; label.textContent = "Sending…";
    var body = new URLSearchParams(); body.set("email", email);
    fetch("/forgot-password", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: body.toString(), credentials: "same-origin" })
      .then(function (res) { return res.json().catch(function () { return {}; }).then(function (d) { return { ok: res.ok, d: d }; }); })
      .then(function (r) {
        if (r.ok && r.d && r.d.ok) { showSent(email); }
        else { showMsg(r.d && typeof r.d.error === "string" ? r.d.error : "Something went wrong. Please try again."); }
      })
      .catch(function () { showMsg("We could not reach the server. Check your connection and try again."); })
      .then(function () { btn.disabled = false; btn.classList.remove("is-busy"); label.textContent = original; });
  });

  if (window.matchMedia && window.matchMedia("(pointer: fine)").matches) input.focus();
})();
</script>
</body>
</html>
