<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Althais — Signed out</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=Space+Mono:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased;
      color: rgba(255,255,255,0.88); min-height: 100vh;
      position: relative; overflow-x: hidden;
    }
    #bg-video-wrap { position: fixed; inset: 0; overflow: hidden; z-index: 0; }
    #bg-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #bg-overlay { position: fixed; inset: 0; z-index: 1; background: rgba(0,0,0,0.55); }
    @keyframes fade-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fade-up 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-6 py-16">

  <div id="bg-video-wrap">
    <video id="bg-video" autoplay muted loop playsinline preload="auto">
      <source src="/videos/city.mp4" type="video/mp4" />
    </video>
  </div>
  <div id="bg-overlay"></div>

  <div class="fade-up" style="position:relative;z-index:2;width:100%;max-width:400px">

    <a href="/" class="flex items-center" style="gap:12px;margin-bottom:32px;justify-content:center">
      <svg width="24" height="24" viewBox="0 0 80 80" fill="none">
        <path d="M5,74 L40,16 L75,74" stroke="#ffffff" stroke-width="8" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="25" fill="none"/>
        <line x1="21" y1="49" x2="59" y2="49" stroke="#ffffff" stroke-width="8" stroke-linecap="butt"/>
      </svg>
      <span style="font-family:'Josefin Sans',sans-serif;font-size:15px;font-weight:600;letter-spacing:0.35em;color:#fff;text-transform:uppercase;padding-left:0.35em">ALTHAIS</span>
    </a>

    <div style="background:rgba(4,8,16,0.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.14);border-radius:0;overflow:hidden">

      <!-- Signed-out confirmation header -->
      <div style="padding:24px;display:flex;align-items:center;gap:14px;border-bottom:1px solid rgba(255,255,255,0.12)">
        <div style="width:36px;height:36px;border-radius:50%;background:rgba(63,217,145,0.16);display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M4.5 10.5l4 4 7-8" stroke="#3fd991" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <div style="font-size:14px;font-weight:600;color:#fff">You've been signed out</div>
          <div style="font-size:12px;color:rgba(255,255,255,0.55);margin-top:2px">Your session has ended securely.</div>
        </div>
      </div>

      <!-- Actions -->
      <div style="padding:24px;display:flex;flex-direction:column;gap:12px">
        <a href="/login"
           style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font-size:13px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:#0a0a0a;background:#fff;border-radius:0;padding:13px;transition:background 0.2s"
           onmouseover="this.style.background='#eee'" onmouseout="this.style.background='#fff'">
          Sign In to Your Account
        </a>
        <a href="/"
           style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font-size:13px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:#fff;background:transparent;border:1px solid rgba(255,255,255,0.3);border-radius:0;padding:12px;transition:background 0.2s, border-color 0.2s"
           onmouseover="this.style.background='rgba(255,255,255,0.1)';this.style.borderColor='#fff'" onmouseout="this.style.background='transparent';this.style.borderColor='rgba(255,255,255,0.3)'">
          Go to Homepage
        </a>
      </div>

      <!-- Footer note -->
      <div style="padding:0 24px 22px">
        <p style="font-size:11.5px;color:rgba(255,255,255,0.45);text-align:center;line-height:1.6">
          For security, close this tab if you're on a shared device.
        </p>
      </div>

    </div>

    <!-- Auto-redirect notice -->
    <p style="text-align:center;font-size:11.5px;color:rgba(255,255,255,0.45);margin-top:20px">
      Redirecting to sign-in in <span id="countdown">30</span>s…
      <button onclick="clearInterval(window._t); this.parentElement.classList.add('hidden')"
              style="color:#fff;text-decoration:underline;background:none;border:none;cursor:pointer;font-size:11.5px;margin-left:4px">cancel</button>
    </p>

  </div>

  <script>
    // On logout we clear the session but preserve each org's namespaced data
    // so when the same user logs back in their claims/patients are still there.
    // We only remove old un-namespaced legacy keys.
    try {
      Object.keys(localStorage).forEach(k => {
        // Remove old un-namespaced keys (legacy from before data isolation)
        if (k.startsWith('althais.') || k === 'althais_active') {
          localStorage.removeItem(k);
        }
        // Remove local:: fallback keys (used when no auth was present)
        if (k.startsWith('local::')) {
          localStorage.removeItem(k);
        }
        // NOTE: we intentionally keep org_xxx:: keys so each org's data
        // persists across logout/login cycles
      });
    } catch (e) {}

    // Countdown → /login
    let s = 30;
    window._t = setInterval(() => {
      s--;
      const el = document.getElementById('countdown');
      if (el) el.textContent = s;
      if (s <= 0) { clearInterval(window._t); window.location.href = '/login'; }
    }, 1000);
  </script>
</body>
</html>
