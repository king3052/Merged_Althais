<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signed Out | Althais</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/althais-tab-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/althais-tab-16.png" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon/althais-tab.svg" />
  <link rel="icon" type="image/png" sizes="48x48" href="/static/favicon/althais-tab-48.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/static/favicon/android-chrome-192x192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/althais-tab-180.png" />
  <link rel="icon" type="image/x-icon" href="/static/favicon/althais-tab.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Inter:wght@600&display=swap" />
  <script src="/static/js/theme.js"></script>
  <link rel="stylesheet" href="/static/althais-landing.css" />
  <link rel="stylesheet" href="/static/althais-auth.css" />
  <link rel="stylesheet" href="/static/althais-dark.css" />
</head>
<body class="login-page">

<div class="lg-shell">
  <section class="lg-left">
    <header class="lg-top">
      <a href="/" class="logo" aria-label="Althais home"><svg width="24" height="24" viewBox="0 0 80 80" fill="none" aria-hidden="true"><path d="M5,74 L40,16 L75,74" stroke="currentColor" stroke-width="8" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="25" fill="none"/><line x1="21" y1="49" x2="59" y2="49" stroke="currentColor" stroke-width="8" stroke-linecap="butt"/></svg><span>Althais</span></a>
      <a href="/" class="btn btn-ghost">
        <svg class="arr" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8H3M7 4L3 8l4 4"/></svg>
        Return To Home
      </a>
    </header>

    <main class="lg-main">
      <div class="lg-form">
        <div class="lg-head">
          <div class="eyebrow">Signed Out</div>
          <h1 class="lg-title">You have been<br /><span class="em">signed out.</span></h1>
          <p class="lg-sub">Your session has ended. If you are on a shared device, close this tab.</p>
        </div>

        <div class="lg-actions">
          <a href="/login" class="btn btn-dark btn-lg lg-submit">Sign In Again <svg class="arr" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></a>
        </div>

        <div id="lo-count">
          <div class="lo-bar" aria-hidden="true"><i id="lo-bar"></i></div>
          <p class="lg-switch lo-note">Sign in page opens in <span id="countdown">30</span>s <button type="button" id="lo-cancel" class="lg-link">Stay Here</button></p>
        </div>
      </div>
    </main>

    <footer class="lg-foot">&copy; 2026 Althais Health, Inc.</footer>
  </section>
</div>

<script>
// On sign-out we clear the session but keep each organization's namespaced data,
  // so when the same person signs back in their claims and patients are still there.
  // Only the old un-namespaced legacy keys are removed.
  try {
    Object.keys(localStorage).forEach(function (k) {
      // old un-namespaced keys (from before data isolation)
      // (the light/dark choice is a preference of this browser, not data: it stays)
      if (k === 'althais.theme.v1') return;
      if (k.indexOf('althais.') === 0 || k === 'althais_active') localStorage.removeItem(k);
      // local:: fallback keys (used when there was no auth)
      if (k.indexOf('local::') === 0) localStorage.removeItem(k);
      // org_xxx:: keys are kept on purpose so each org's data survives sign-out and sign-in
    });
  } catch (e) {}

  // Countdown to the sign-in page, with a progress bar and a way to stay.
  (function () {
    var s = 30, el = document.getElementById('countdown'), bar = document.getElementById('lo-bar');
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (bar && !reduce) { bar.style.transition = 'width 30s linear'; requestAnimationFrame(function () { requestAnimationFrame(function () { bar.style.width = '0%'; }); }); }
    var t = setInterval(function () {
      s--; if (el) el.textContent = s;
      if (s <= 0) { clearInterval(t); window.location.href = '/login'; }
    }, 1000);
    document.getElementById('lo-cancel').addEventListener('click', function () {
      clearInterval(t);
      document.getElementById('lo-count').hidden = true;
    });
  })();
</script>
</body>
</html>
