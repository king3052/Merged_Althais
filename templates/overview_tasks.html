<!DOCTYPE html>
<html lang="en">
<head>
  {% include "_head.html" %}
  <title>Althais — Tasks</title>
  <style>
    .fld { width:100%; border-radius:2px; border:1px solid #e4e6eb; background:#fff; padding:7px 10px; font-size:12.5px; color:#0f1116; outline:none; }
    .fld:focus { border-color:#0d5bd7; }
    .lbl { display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:#6b7280; font-weight:600; margin-bottom:5px; }
    .tab { font-size:12.5px; padding:6px 12px; border-radius:2px; color:#4a505c; font-weight:500; background:none; border:0; cursor:pointer; }
    .tab.active { background:#e6efff; color:#0a47b0; font-weight:600; }
    .tab .n { font-size:10.5px; margin-left:4px; color:inherit; opacity:.75; }
    .task { display:flex; align-items:flex-start; gap:10px; padding:11px 16px; border-bottom:1px solid #eceef2; }
    .task:last-child { border-bottom:0; }
    .done-box { width:18px; height:18px; border-radius:50%; border:1.5px solid #c7cad1; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:transparent; cursor:pointer; margin-top:1px; }
    .done-box:hover { border-color:#0c8a4f; }
    .done-box.is-done { background:#0c8a4f; border-color:#0c8a4f; }
    .act { font-size:11px; font-weight:600; color:#0d5bd7; background:none; border:0; cursor:pointer; padding:0 4px; }
    .act.risk { color:#c83838; }
    .sugg { padding:10px 14px; border-bottom:1px solid #eceef2; }
    .sugg:last-child { border-bottom:0; }
    html[data-theme-resolved="dark"] .fld { background:#14181f; border-color:#2c313b; color:#e7eaf2; }
    html[data-theme-resolved="dark"] .tab { color:#aab0bf; }
    html[data-theme-resolved="dark"] .tab.active { background:#182740; color:#9dbcff; }
    html[data-theme-resolved="dark"] .task, html[data-theme-resolved="dark"] .sugg { border-color:#2c313b; }
    html[data-theme-resolved="dark"] .act { color:#6f9eff; }
  </style>
</head>
<body class="bg-shell">

  {% include "_nav.html" %}

  <div class="max-w-[1560px] mx-auto">
    <div class="px-6 py-5 bg-panel border-b border-line flex items-center justify-between gap-3 flex-wrap">
      <div>
        <h1 class="text-[18px] font-semibold text-ink-900">Tasks</h1>
        <p class="text-[12px] text-ink-500 mt-0.5">Follow-ups and to-dos for the whole practice, shared with everyone on your team.</p>
      </div>
      <button id="new-btn" type="button" class="text-[12px] px-2.5 py-1.5 rounded-sm bg-med-600 text-white hover:bg-med-700 font-semibold whitespace-nowrap">+ New Task</button>
    </div>

    <div class="p-5 grid grid-cols-1 xl:grid-cols-[1fr_360px] gap-5 items-start">
      <div>
        <!-- form -->
        <form id="task-form" class="hidden bg-panel border border-line rounded-sm p-4 mb-4" autocomplete="off">
          <div class="flex items-center justify-between mb-3"><h3 id="form-title" class="text-[13px] font-semibold text-ink-900">New Task</h3></div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div class="md:col-span-2"><label class="lbl" for="t-title">Task</label><input id="t-title" class="fld" placeholder="e.g. Call BCBS about claim CL-2026-003" required /></div>
            <div class="md:col-span-2"><label class="lbl" for="t-notes">Notes</label><textarea id="t-notes" rows="2" class="fld" placeholder="Optional"></textarea></div>
            <div><label class="lbl" for="t-assignee">Assign to</label><select id="t-assignee" class="fld"></select></div>
            <div class="grid grid-cols-2 gap-3">
              <div><label class="lbl" for="t-due">Due</label><input id="t-due" type="date" class="fld num" /></div>
              <div><label class="lbl" for="t-priority">Priority</label><select id="t-priority" class="fld"><option>High</option><option selected>Medium</option><option>Low</option></select></div>
            </div>
            <div class="md:col-span-2"><label class="lbl" for="t-link">Link (optional)</label><input id="t-link" class="fld" placeholder="/revenue/denials" /></div>
          </div>
          <div class="mt-3 flex items-center gap-2">
            <button id="t-save" type="submit" class="text-[12px] px-3 py-1.5 rounded-sm bg-med-600 text-white hover:bg-med-700 font-semibold">Save Task</button>
            <button id="t-cancel" type="button" class="text-[12px] px-3 py-1.5 rounded-sm border border-line bg-white text-ink-700 hover:bg-shell">Cancel</button>
          </div>
        </form>

        <div class="flex flex-wrap items-center gap-2 mb-3">
          <div class="flex items-center gap-1" id="tabs" role="tablist"></div>
          <input id="search" type="search" placeholder="Search tasks…" class="fld ml-auto" style="width:220px" aria-label="Search tasks" />
        </div>

        <div class="bg-panel border border-line rounded-sm">
          <div id="list"><div class="px-4 py-10 text-center text-[12px] text-ink-500">Loading…</div></div>
        </div>
      </div>

      <aside class="bg-panel border border-line rounded-sm xl:sticky xl:top-[100px]">
        <div class="px-4 py-2.5 border-b border-line flex items-center justify-between">
          <h3 class="text-[13px] font-semibold text-ink-900">Suggested From AI Inbox</h3>
          <a href="/overview/inbox" class="text-[11px] font-semibold text-med-600">View All →</a>
        </div>
        <div id="suggestions"><div class="px-4 py-6 text-center text-[12px] text-ink-500">Loading…</div></div>
      </aside>
    </div>
  </div>

  <script src="/static/js/staff-store.js"></script>
  <script src="/static/js/practice-data.js"></script>
  <script>
    const P = window.PracticeData;
    const $ = (id) => document.getElementById(id);
    const esc = P.esc;
    const ME = P.currentUserName();
    let DOC = null, STAFF = null, LOCAL = P.local(), view = 'mine', editingId = null;
    const PRI = { High: 'background:#ffe1e1;color:#c83838', Medium: 'background:#fff0d6;color:#b86a00', Low: 'background:#eceef2;color:#4a505c' };

    function assignees() {
      const names = [ME];
      if (STAFF) STAFF.people.filter(p => p.status !== 'inactive').forEach(p => names.push(p.name));
      DOC.tasks.forEach(t => t.assignee && names.push(t.assignee));
      return [...new Set(names.filter(Boolean))];
    }
    const isOverdue = (t) => t.status !== 'done' && t.due && P.daysUntil(t.due) < 0;
    const VIEWS = {
      mine:    { label: 'My Tasks',  test: t => t.status !== 'done' && t.assignee === ME },
      open:    { label: 'All Open',  test: t => t.status !== 'done' },
      overdue: { label: 'Overdue',   test: isOverdue },
      done:    { label: 'Completed', test: t => t.status === 'done' },
    };

    function render() {
      $('tabs').innerHTML = Object.entries(VIEWS).map(([k, v]) =>
        `<button type="button" role="tab" aria-selected="${k === view}" class="tab${k === view ? ' active' : ''}" data-view="${k}">${v.label}<span class="n">${DOC.tasks.filter(v.test).length}</span></button>`).join('');
      const q = $('search').value.trim().toLowerCase();
      const rows = DOC.tasks.filter(VIEWS[view].test).filter(t => !q || (t.title + ' ' + (t.notes || '') + ' ' + (t.assignee || '')).toLowerCase().includes(q))
        .sort(view === 'done'
          ? (a, b) => (b.completedAt || '').localeCompare(a.completedAt || '')
          : (a, b) => (a.due || '9999').localeCompare(b.due || '9999') || P.LEVEL_RANK[a.priority] - P.LEVEL_RANK[b.priority]);
      if (!rows.length) {
        const msg = q ? 'No tasks match your search.' : ({ mine: 'Nothing assigned to you. Nice.', open: 'No open tasks.', overdue: 'Nothing overdue.', done: 'No completed tasks yet.' })[view];
        $('list').innerHTML = `<div class="px-4 py-10 text-center text-[12px] text-ink-500">${msg}${!q && view !== 'done' ? ' Add one with <span class="font-semibold text-med-600">+ New Task</span>, or pick a suggestion.' : ''}</div>`;
        return;
      }
      $('list').innerHTML = rows.map(t => {
        const d = P.daysUntil(t.due), done = t.status === 'done';
        const dueTxt = !t.due ? '' : (done ? '' : (d < 0 ? `<span class="text-risk-600 font-semibold">${-d}d overdue</span>` : (d === 0 ? '<span class="text-warn-600 font-semibold">Due today</span>' : `Due ${esc(P.fmtDate(t.due))}`)));
        const meta = [t.assignee ? (t.assignee === ME ? 'You' : esc(t.assignee)) : 'Unassigned', dueTxt,
          done ? `Done ${esc(P.relTime(t.completedAt))}${t.completedBy && t.completedBy !== ME ? ' by ' + esc(t.completedBy) : ''}` : '',
          t.link ? `<a href="${esc(t.link)}" class="font-semibold text-med-600">Open →</a>` : ''].filter(Boolean).join(' · ');
        return `
        <div class="task">
          <button type="button" class="done-box${done ? ' is-done' : ''}" data-toggle="${esc(t.id)}" aria-label="${done ? 'Reopen' : 'Complete'}: ${esc(t.title)}">
            ${done ? '<svg class="h-3 w-3 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="m20 6-11 11-5-5"/></svg>' : ''}
          </button>
          <div class="flex-1 min-w-0">
            <div class="flex items-start gap-2">
              <div class="text-[13px] ${done ? 'text-ink-400 line-through' : 'text-ink-900 font-medium'} flex-1">${esc(t.title)}</div>
              ${done ? '' : `<span class="pill flex-shrink-0" style="${PRI[t.priority] || PRI.Medium}">${esc(t.priority)}</span>`}
            </div>
            ${t.notes ? `<div class="text-[12px] text-ink-600 mt-0.5 whitespace-pre-line">${esc(t.notes)}</div>` : ''}
            <div class="text-[11.5px] text-ink-500 mt-1">${meta}</div>
          </div>
          <div class="flex-shrink-0 whitespace-nowrap">${done ? '' : `<button class="act" data-edit="${esc(t.id)}">Edit</button>`}<button class="act risk" data-delete="${esc(t.id)}">Delete</button></div>
        </div>`;
      }).join('');
    }

    function renderSuggestions() {
      const openAlertIds = new Set(DOC.tasks.filter(t => t.status !== 'done' && t.alertId).map(t => t.alertId));
      const list = P.alerts(LOCAL, STAFF).filter(a => !DOC.dismissed[a.id] && !openAlertIds.has(a.id)).slice(0, 6);
      $('suggestions').innerHTML = list.length ? list.map(a => `
        <div class="sugg">
          <div class="flex items-start gap-2"><span class="pill flex-shrink-0" style="${PRI[a.level]}">${a.level}</span><div class="text-[12.5px] text-ink-900 font-medium">${esc(a.task)}</div></div>
          <div class="text-[11px] text-ink-500 mt-1">${esc(a.detail)}</div>
          <button type="button" class="act mt-1" style="padding-left:0" data-suggest="${esc(a.id)}">+ Add As Task</button>
        </div>`).join('')
        : '<div class="px-4 py-6 text-center text-[12px] text-ink-500">Nothing to suggest right now.</div>';
    }

    // ---- form ----
    function openForm(t, preset) {
      editingId = t ? t.id : null;
      const src = t || preset || {};
      $('form-title').textContent = t ? 'Edit Task' : 'New Task';
      $('t-title').value = src.title || '';
      $('t-notes').value = src.notes || '';
      $('t-assignee').innerHTML = assignees().map(n => `<option value="${esc(n)}"${n === (src.assignee || ME) ? ' selected' : ''}>${n === ME ? esc(n) + ' (me)' : esc(n)}</option>`).join('') + `<option value=""${src.assignee === '' ? ' selected' : ''}>Unassigned</option>`;
      $('t-due').value = src.due || P.isoOffset(3);
      $('t-priority').value = src.priority || 'Medium';
      $('t-link').value = src.link || '';
      $('task-form').dataset.alertId = src.alertId || '';
      $('task-form').classList.remove('hidden');
      $('t-title').focus();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function closeForm() { $('task-form').classList.add('hidden'); editingId = null; }
    $('new-btn').addEventListener('click', () => openForm(null));
    $('t-cancel').addEventListener('click', closeForm);
    $('task-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const vals = { title: $('t-title').value.trim(), notes: $('t-notes').value.trim(), assignee: $('t-assignee').value, due: $('t-due').value, priority: $('t-priority').value, link: $('t-link').value.trim() };
      if (!vals.title) { $('t-title').focus(); return; }
      if (vals.link && !vals.link.startsWith('/') && !/^https?:\/\//.test(vals.link)) vals.link = '/' + vals.link;
      const id = editingId, alertId = $('task-form').dataset.alertId;
      DOC = await P.tasks.save(d => {
        if (id) {
          Object.assign(d.tasks.find(t => t.id === id), vals);
          P.tasks.log(d, `Edited task: ${vals.title}`, '/overview/tasks');
        } else {
          d.tasks.push(Object.assign({ id: P.uid('task'), status: 'open', alertId, createdBy: ME, createdAt: new Date().toISOString() }, vals));
          P.tasks.log(d, `Created task: ${vals.title}${vals.assignee && vals.assignee !== ME ? ' (assigned to ' + vals.assignee + ')' : ''}`, '/overview/tasks');
        }
      }, id ? 'Task updated' : 'Task added').catch(() => DOC);
      closeForm(); render(); renderSuggestions();
    });

    // ---- list actions ----
    $('list').addEventListener('click', async (e) => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.edit) return openForm(DOC.tasks.find(t => t.id === b.dataset.edit));
      if (b.dataset.toggle) {
        const id = b.dataset.toggle;
        DOC = await P.tasks.save(d => {
          const t = d.tasks.find(x => x.id === id);
          const done = t.status !== 'done';
          Object.assign(t, done ? { status: 'done', completedAt: new Date().toISOString(), completedBy: ME } : { status: 'open', completedAt: '', completedBy: '' });
          P.tasks.log(d, `${done ? 'Completed' : 'Reopened'} task: ${t.title}`, '/overview/tasks');
        }).catch(() => DOC);
      }
      if (b.dataset.delete) {
        const t = DOC.tasks.find(x => x.id === b.dataset.delete);
        if (!confirm(`Delete "${t.title}"?`)) return;
        DOC = await P.tasks.save(d => { d.tasks = d.tasks.filter(x => x.id !== t.id); P.tasks.log(d, `Deleted task: ${t.title}`); }, 'Task deleted').catch(() => DOC);
      }
      render(); renderSuggestions();
    });
    $('tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-view]'); if (b) { view = b.dataset.view; render(); } });
    $('search').addEventListener('input', render);
    $('suggestions').addEventListener('click', (e) => {
      const b = e.target.closest('[data-suggest]'); if (!b) return;
      const a = P.alerts(LOCAL, STAFF).find(x => x.id === b.dataset.suggest);
      if (a) openForm(null, { title: a.task, notes: a.detail, priority: a.level, link: a.href, alertId: a.id, due: a.level === 'High' ? P.isoOffset(1) : P.isoOffset(3) });
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('task-form').classList.contains('hidden')) closeForm(); });

    Promise.all([P.tasks.load(), window.StaffStore ? StaffStore.load().catch(() => null) : null]).then(([d, s]) => {
      DOC = d; STAFF = s;
      const q = new URLSearchParams(location.search);
      if (q.get('view') && VIEWS[q.get('view')]) view = q.get('view');
      else if (!DOC.tasks.some(VIEWS.mine.test) && DOC.tasks.some(VIEWS.open.test)) view = 'open';
      render(); renderSuggestions();
      // AI Inbox's "Create task" lands here with the alert pre-filled
      if (q.get('alert')) { const a = P.alerts(LOCAL, STAFF).find(x => x.id === q.get('alert')); if (a) openForm(null, { title: a.task, notes: a.detail, priority: a.level, link: a.href, alertId: a.id, due: a.level === 'High' ? P.isoOffset(1) : P.isoOffset(3) }); }
      if (q.get('new') === '1') openForm(null);
    }).catch(e => { $('list').innerHTML = `<div class="px-4 py-10 text-center text-[12px] text-risk-600">${esc(e.message)}</div>`; });
  </script>
</body>
</html>
