<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome | Althais</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/althais-tab-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/althais-tab-16.png" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon/althais-tab.svg" />
  <link rel="icon" type="image/png" sizes="48x48" href="/static/favicon/althais-tab-48.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/static/favicon/android-chrome-192x192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/althais-tab-180.png" />
  <link rel="icon" type="image/x-icon" href="/static/favicon/althais-tab.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Inter:wght@600&display=swap" />
  <script src="/static/js/theme.js"></script>
  <link rel="stylesheet" href="/static/althais-landing.css" />
  <link rel="stylesheet" href="/static/althais-auth.css" />
  <link rel="stylesheet" href="/static/althais-dark.css" />
</head>
<body class="login-page">

<div class="lg-shell">
  <section class="lg-left">
    <header class="lg-top">
      <a href="/" class="logo" aria-label="Althais home"><svg width="24" height="24" viewBox="0 0 80 80" fill="none" aria-hidden="true"><path d="M5,74 L40,16 L75,74" stroke="currentColor" stroke-width="8" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="25" fill="none"/><line x1="21" y1="49" x2="59" y2="49" stroke="currentColor" stroke-width="8" stroke-linecap="butt"/></svg><span>Althais</span></a>
    </header>

    <main class="lg-main">
      <div class="lg-form">
        <div class="lg-head">
          <div class="eyebrow">Welcome</div>
          <h1 class="lg-title">What should we<br /><span class="em">call you?</span></h1>
          <p class="lg-sub">This is how you will appear in Althais.</p>
        </div>

        <div id="auth-msg" class="lg-msg" role="alert" hidden></div>

        <form id="auth-form" novalidate>
          <div class="field">
            <label for="f-name">Your name</label>
            <input id="f-name" name="name" type="text" autocomplete="name" required placeholder="Dr. Jane Smith" value="{{ user.full_name or '' }}" />
          </div>
          <div class="field">
            <label for="f-provider">Provider name (optional)</label>
            <input id="f-provider" name="provider" type="text" autocomplete="off" placeholder="Dr. J. Smith" />
            <p class="lg-hint">Shown on appointments and claims. Leave blank if you are not a billing provider.</p>
          </div>
          <button id="submit-btn" type="submit" class="btn btn-dark btn-lg lg-submit">
            <span id="submit-label">Get Started</span>
            <svg class="arr" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
          </button>
        </form>

        <p class="lg-switch">Not now? <button id="skip-link" type="button" class="lg-link">Skip For Now</button></p>
      </div>
    </main>

    <footer class="lg-foot">&copy; 2026 Althais Health, Inc.</footer>
  </section>
</div>

<script>
(function () {
  "use strict";
  function $(id) { return document.getElementById(id); }
  var msg = $("auth-msg"), btn = $("submit-btn"), label = $("submit-label"), nameInput = $("f-name"), provInput = $("f-provider"), skip = $("skip-link");
  var IDLE = label.textContent;

  function showMsg(text) { msg.textContent = text; msg.hidden = false; }
  function clearMsg() { msg.hidden = true; nameInput.classList.remove("bad"); }
  nameInput.addEventListener("input", function () { nameInput.classList.remove("bad"); });

  function busy(on, text) { btn.disabled = on; skip.disabled = on; btn.classList.toggle("is-busy", on); label.textContent = on ? text : IDLE; }

  /* the backend takes URL-encoded form fields; a skip sends both blank */
  function save(isSkip) {
    clearMsg();
    var name = nameInput.value.trim();
    if (!isSkip && !name) { showMsg("Please enter your name, or skip for now."); nameInput.classList.add("bad"); nameInput.focus(); return; }
    busy(true, isSkip ? "Skipping…" : "Saving…");
    var body = new URLSearchParams();
    body.set("full_name", isSkip ? "" : name);
    body.set("provider_name", isSkip ? "" : provInput.value.trim());
    fetch("/api/me/complete-onboarding", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: body.toString(), credentials: "same-origin" })
      .then(function (res) { return res.json().catch(function () { return {}; }).then(function (d) { return { ok: res.ok, d: d }; }); })
      .then(function (r) {
        if (r.ok && r.d && r.d.ok) { label.textContent = "Redirecting…"; window.location.href = r.d.redirect || "/overview"; return; }
        var err = r.d && (typeof r.d.detail === "string" ? r.d.detail : (typeof r.d.error === "string" ? r.d.error : ""));
        showMsg(err || "Something went wrong. Please try again."); busy(false);
      })
      .catch(function () { showMsg("We could not reach the server. Check your connection and try again."); busy(false); });
  }

  $("auth-form").addEventListener("submit", function (e) { e.preventDefault(); save(false); });
  skip.addEventListener("click", function () { save(true); });

  if (window.matchMedia && window.matchMedia("(pointer: fine)").matches) { nameInput.focus(); nameInput.select(); }
})();
</script>
</body>
</html>
