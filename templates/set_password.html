<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Your Password | Althais</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/althais-tab-32.png" />
  <link rel="icon" type="image/x-icon" href="/static/favicon/althais-tab.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Inter:wght@600&display=swap" />
  <script src="/static/js/theme.js"></script>
  <link rel="stylesheet" href="/static/althais-landing.css" />
  <link rel="stylesheet" href="/static/althais-auth.css" />
  <link rel="stylesheet" href="/static/althais-dark.css" />
</head>
<body class="login-page">
<div class="lg-shell">
  <section class="lg-left">
    <header class="lg-top">
      <a href="/" class="logo" aria-label="Althais home"><svg width="24" height="24" viewBox="0 0 80 80" fill="none" aria-hidden="true"><path d="M5,74 L40,16 L75,74" stroke="currentColor" stroke-width="8" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="25" fill="none"/><line x1="21" y1="49" x2="59" y2="49" stroke="currentColor" stroke-width="8" stroke-linecap="butt"/></svg><span>Althais</span></a>
    </header>

    <main class="lg-main">
      <div class="lg-form">
        <div class="eyebrow">Almost Done</div>
        <h1 class="lg-title">Create your<br /><span class="em">password.</span></h1>
        <p class="lg-lede">{% if name %}Welcome, {{ name.split(' ')[0] }}. {% endif %}Choose a password to replace the temporary one from your email. You’ll use it to sign in to Althais from now on.</p>

        <div id="msg" class="lg-msg is-plain" role="alert" hidden></div>

        <form id="form" class="lg-plain" novalidate>
          <input type="email" autocomplete="username" value="{{ email }}" hidden />
          <div class="field">
            <label for="f-new">New password (at least 8 characters)</label>
            <div class="pw"><input id="f-new" type="password" autocomplete="new-password" /></div>
          </div>
          <div class="field">
            <label for="f-confirm">Type it again</label>
            <div class="pw"><input id="f-confirm" type="password" autocomplete="new-password" /></div>
          </div>
          <button id="submit" type="submit" class="btn btn-dark btn-lg lg-submit">
            <span>Save Password</span>
            <svg class="arr" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
          </button>
        </form>
      </div>
    </main>
    <footer class="lg-foot">&copy; 2026 Althais Health, Inc.</footer>
  </section>
</div>

<script>
  (function () {
    const $ = (id) => document.getElementById(id);
    function say(text) { const m = $("msg"); m.textContent = text; m.hidden = false; }
    $("f-new").focus();
    $("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const pw = $("f-new").value;
      if (pw.length < 8) { $("f-new").focus(); return say("Use at least 8 characters."); }
      if (pw !== $("f-confirm").value) { $("f-confirm").focus(); return say("The two passwords don’t match."); }
      $("submit").disabled = true;
      fetch("/api/me/set-password", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: pw }) })
        .then((r) => r.json().then((j) => ({ ok: r.ok, j })))
        .then(({ ok, j }) => { if (ok) location.href = j.redirect || "/portal"; else { say(j.error || j.detail || "Couldn’t save your password."); $("submit").disabled = false; } })
        .catch(() => { say("Couldn’t reach Althais. Try again."); $("submit").disabled = false; });
    });
  })();
</script>
</body>
</html>
